{{ define "main" }}
<section class="intro">
  {{ .Content }}
</section>
<section class="post-list" aria-label="Ostatnie wpisy">
  {{ $posts := where site.RegularPages "Section" "in" (slice "finanse") }}
  {{ range first 20 $posts.ByDate.Reverse }}
    {{ partial "post-item.html" . }}
  {{ else }}
    <p class="empty">Pierwsze wpisy w przygotowaniu.</p>
  {{ end }}
</section>
{{ end }}
